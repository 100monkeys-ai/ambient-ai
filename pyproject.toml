[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ambient_ai"
version = "0.0.1"
description = "Ambient AI: an SMS-native, per-sender-isolated agent (pre-alpha skeleton)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-ai-slim[anthropic,mcp]",
    "twilio",
    "httpx",
    "python-dotenv",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ambient_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
